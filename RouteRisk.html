  <footer class="border-t border-niyata-line bg-white">
    <div class="mx-auto flex max-w-7xl flex-col gap-6 px-5 py-10 sm:flex-row sm:items-center sm:justify-between lg:px-8">
      <div class="flex items-center gap-3">
        <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-niyata-ink text-sm font-extrabold text-white">N</span>
        <div>
          <p class="text-sm font-extrabold">RouteRisk by Niyata</p>
          <p class="text-xs font-semibold text-niyata-muted">Route risk assessment and transportation intelligence.</p>
        </div>
      </div>
      <div class="flex flex-wrap gap-5 text-sm font-bold text-niyata-muted">
        <a href="index.html" class="hover:text-niyata-ink">Back to Niyata</a>
        <a href="#capabilities" class="hover:text-niyata-ink">Capabilities</a>
        <a href="#routerisk" class="hover:text-niyata-ink">RouteRisk</a>
        <a href="#case-studies" class="hover:text-niyata-ink">Case Studies</a>
        <a href="#contact" class="hover:text-niyata-ink">Contact</a>
        <a href="#contact" class="hover:text-niyata-ink">Privacy</a>
      </div>
    </div>
  </footer>

  <script>
    const trackEvent = (name, detail = {}) => {
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ event: name, ...detail });
      if (window.gtag) window.gtag("event", name, detail);
      if (window.clarity) window.clarity("event", name);
      if (window.fbq) window.fbq("trackCustom", name, detail);
    };

    document.querySelectorAll("[data-track]").forEach((element) => {
      element.addEventListener("click", () => trackEvent("cta_click", { label: element.dataset.track }));
    });

    const menuButton = document.getElementById("menuButton");
    const mobileMenu = document.getElementById("mobileMenu");
    menuButton.addEventListener("click", () => {
      const isOpen = !mobileMenu.classList.contains("hidden");
      mobileMenu.classList.toggle("hidden");
      menuButton.setAttribute("aria-expanded", String(!isOpen));
    });
    document.querySelectorAll("#mobileMenu a").forEach((link) => {
      link.addEventListener("click", () => {
        mobileMenu.classList.add("hidden");
        menuButton.setAttribute("aria-expanded", "false");
      });
    });

    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) entry.target.classList.add("visible");
      });
    }, { threshold: 0.12 });
    document.querySelectorAll(".fade-up").forEach((element) => revealObserver.observe(element));

    document.querySelectorAll("#methodBars > div").forEach((item) => {
      const weight = Number(item.dataset.weight);
      const label = item.dataset.label;
      item.innerHTML = `
        <div class="mb-2 flex items-center justify-between gap-4">
          <span class="text-sm font-extrabold text-niyata-ink">${label}</span>
          <span class="text-sm font-extrabold text-niyata-muted">${weight}%</span>
        </div>
        <div class="h-3 overflow-hidden rounded-full bg-niyata-cloud">
          <div class="h-full rounded-full bg-niyata-green" style="width:${weight * 3.8}%"></div>
        </div>
      `;
    });

    const controls = ["roadType", "weather", "traffic", "terrain"].map((id) => document.getElementById(id));
    const riskScore = document.getElementById("riskScore");
    const riskLevel = document.getElementById("riskLevel");
    const riskBar = document.getElementById("riskBar");
    const riskRecommendation = document.getElementById("riskRecommendation");

    const getRiskResult = () => {
      const [road, weather, traffic, terrain] = controls.map((control) => Number(control.value));
      const score = Math.round((road * 0.32) + (weather * 0.28) + (traffic * 0.18) + (terrain * 0.22));
      if (score < 35) {
        return {
          score,
          level: "LOW RISK",
          color: "bg-niyata-green",
          text: "text-niyata-green",
          badge: "bg-niyata-mint text-niyata-greenDark",
          recommendation: "Proceed with normal dispatch. Continue monitoring weather and access updates."
        };
      }
      if (score < 70) {
        return {
          score,
          level: "WATCH",
          color: "bg-niyata-amber",
          text: "text-niyata-amber",
          badge: "bg-amber-100 text-amber-800",
          recommendation: "Dispatch with monitoring. Prepare alternative route, supervisor approval, and updated field confirmation."
        };
      }
      return {
        score,
        level: "HIGH RISK",
        color: "bg-niyata-red",
        text: "text-niyata-red",
        badge: "bg-red-100 text-red-800",
        recommendation: "Delay, reroute, or escalate for managerial approval. Conditions are likely to affect safety, cost, or service reliability."
      };
    };

    const renderRisk = () => {
      const result = getRiskResult();
      riskScore.textContent = result.score;
      riskScore.className = `mt-2 text-6xl font-extrabold tracking-tight ${result.text}`;
      riskLevel.textContent = result.level;
      riskLevel.className = `w-fit rounded-full px-4 py-2 text-sm font-extrabold ${result.badge}`;
      riskBar.className = `h-full rounded-full transition-all duration-500 ${result.color}`;
      riskBar.style.width = `${result.score}%`;
      riskRecommendation.textContent = result.recommendation;
      trackEvent("demo_usage", { score: result.score, level: result.level });
    };

    document.getElementById("calculateRisk").addEventListener("click", renderRisk);
    controls.forEach((control) => control.addEventListener("change", renderRisk));
    renderRisk();

    const contactForm = document.getElementById("contactForm");
    const submitButton = document.getElementById("submitButton");
    const submitText = document.getElementById("submitText");
    const submitSpinner = document.getElementById("submitSpinner");
    const formStatus = document.getElementById("formStatus");

    const showStatus = (message, type) => {
      formStatus.textContent = message;
      formStatus.className = `mt-4 rounded-2xl px-4 py-3 text-sm font-bold ${type === "success" ? "bg-niyata-mint text-niyata-greenDark" : "bg-red-50 text-red-700"}`;
      formStatus.classList.remove("hidden");
    };

    contactForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      formStatus.classList.add("hidden");
      const invalidField = [...contactForm.querySelectorAll(".form-field")].find((field) => !field.checkValidity());
      if (invalidField) {
        invalidField.focus();
        showStatus("Please complete all required fields with a valid work email.", "error");
        return;
      }

      trackEvent("form_submission_started", { form: "enterprise_pilot" });
      submitButton.disabled = true;
      submitText.textContent = "Submitting...";
      submitSpinner.classList.remove("hidden");

      const isPlaceholder = contactForm.action.includes("YOUR_FORMSPREE_ENDPOINT");
      try {
        if (isPlaceholder) {
          await new Promise((resolve) => setTimeout(resolve, 700));
        } else {
          const response = await fetch(contactForm.action, {
            method: "POST",
            body: new FormData(contactForm),
            headers: { Accept: "application/json" }
          });
          if (!response.ok) throw new Error("Form submission failed");
        }
        trackEvent("form_submission_success", { form: "enterprise_pilot", placeholder: isPlaceholder });
        contactForm.reset();
        showStatus(isPlaceholder ? "Prototype success. Replace the Formspree endpoint to send this form to production." : "Thanks. Your enterprise pilot request has been submitted.", "success");
      } catch (error) {
        trackEvent("form_submission_error", { form: "enterprise_pilot" });
        showStatus("Something went wrong. Please try again or contact the team directly.", "error");
      } finally {
        submitButton.disabled = false;
        submitText.textContent = "Request enterprise pilot";
        submitSpinner.classList.add("hidden");
      }
    });
  </script>
</body>
</html>
