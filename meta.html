<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Product - Landing Page</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background: #0f0f10; color: #fff; line-height: 1.6; }
  .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
  
  header { padding: 20px 0; border-bottom: 1px solid #222; }
  nav { display: flex; justify-content: space-between; align-items: center; }
  .logo { font-size: 1.5rem; font-weight: 700; }
  .btn { padding: 12px 24px; background: #10b981; color: #fff; border: none; border-radius: 8px; text-decoration: none; font-weight: 600; cursor: pointer; }
  .btn:hover { background: #059669; }
  
  .hero { padding: 100px 0; text-align: center; }
  .hero h1 { font-size: 3rem; margin-bottom: 20px; }
  .hero p { font-size: 1.2rem; color: #aaa; margin-bottom: 30px; max-width: 600px; margin-left: auto; margin-right: auto; }
  
  .features { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; padding: 80px 0; }
  .feature { background: #1a1a1b; padding: 30px; border-radius: 12px; }
  .feature h3 { margin-bottom: 10px; }
  
  footer { text-align: center; padding: 40px 0; color: #666; border-top: 1px solid #222; }
  
  @media (max-width: 768px) {
    .hero h1 { font-size: 2rem; }
  }
</style>
</head>

    <nav>

</header>

    <p>A short, punchy tagline that tells people exactly what you do and why it matters.</p>
    <a href="#cta" class="btn">Start Free Trial</a>
  </div>
</section>

        <p>Lightning quick performance that your users will love.</p>
